<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whale model sheet</title>
<style>
  html, body { margin: 0; height: 100%; background: #eef0f4; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #475066; }
  canvas { display: block; }
  .label { position: fixed; font-size: 12px; letter-spacing: .04em; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Model sheet for assets/whale.glb: side, top, front, three-quarter from above and below, and from behind.
// ?t=seconds into the swim clip (default 0); ?play=1 animates; ?view=side (or top, front, above, below, rear)
// renders that one view full-window.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const qs = new URLSearchParams(location.search);
// [label, camera direction (from the target), up]
const VIEWS = {
  side: ['SIDE', [1, 0, 0]],
  top: ['TOP', [0, 1, 0], [1, 0, 0]],
  front: ['FRONT', [0, 0, 1]],
  above: ['THREE-QUARTER ABOVE', [0.75, 0.55, 0.65]],
  below: ['THREE-QUARTER BELOW', [0.8, -0.5, 0.55]],
  rear: ['THREE-QUARTER REAR', [-0.7, 0.35, -0.75]]
};
const order = qs.get('view') ? [qs.get('view')] : ['side', 'top', 'front', 'above', 'below', 'rear'];

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#ffffff', '#9a9aa8', 1.7));
const sun = new THREE.DirectionalLight('#ffffff', 2);
sun.position.set(3, 6, 4);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(14, 1, 1, 600);

const gltf = await new GLTFLoader().loadAsync('assets/whale.glb');
scene.add(gltf.scene);
const mixer = new THREE.AnimationMixer(gltf.scene);
mixer.clipAction(gltf.animations[0]).play();
mixer.update(+(qs.get('t') || 0));
const ex = gltf.scene.children[0]?.userData || gltf.scene.userData;

const W = innerWidth, H = innerHeight, cols = order.length > 1 ? 2 : 1, rows = Math.ceil(order.length / cols);
const cw = W / cols, ch = H / rows;
function label(text, x, y) {
  const d = document.createElement('div');
  d.className = 'label'; d.textContent = text; d.style.left = x + 'px'; d.style.top = y + 'px';
  document.body.appendChild(d);
}
order.forEach((v, i) => label(VIEWS[v][0], (i % cols) * cw + 12, Math.floor(i / cols) * ch + 6));
label(`whale · t ${(+(qs.get('t') || 0)).toFixed(2)} s · ${JSON.stringify(ex)}`, 12, H - 22);

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = (now - last) / 1000; last = now;
  if (qs.get('play')) mixer.update(dt);
  renderer.setClearColor('#eef0f4'); renderer.setScissor(0, 0, W, H); renderer.setViewport(0, 0, W, H); renderer.clear();
  order.forEach((v, i) => {
    const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch;
    renderer.setViewport(x, y, cw, ch); renderer.setScissor(x, y, cw, ch);
    camera.aspect = cw / ch; camera.updateProjectionMatrix();
    const d = new THREE.Vector3(...VIEWS[v][1]).normalize();
    const [fw, fh] = v === 'front' ? [17, 12] : [29, 16];        // world size to frame (wide, high)
    const tn = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const dist = Math.max(fw / 2 / (tn * camera.aspect), fh / 2 / tn);
    camera.position.copy(d.multiplyScalar(dist));
    camera.up.set(...(VIEWS[v][2] || [0, 1, 0]));
    camera.lookAt(0, 0, -0.75);
    sun.position.copy(camera.position).add(new THREE.Vector3(0, 30, 0));
    renderer.render(scene, camera);
  });
  window.__ready = true;
});
</script>
</body>
</html>
