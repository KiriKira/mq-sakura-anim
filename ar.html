<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakura QR AR</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 14px/1.5 system-ui, sans-serif; color: #fff; }
  /* the camera image and the 3D layer cover the screen with the video's shape, cropped like object-fit: cover */
  #wrap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #wrap video, #wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #nn { position: fixed; left: 8px; bottom: 8px; width: 160px; height: 160px; opacity: .85; display: none; }
  body.debug #nn { display: block; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 24px; text-align: center; background: radial-gradient(#4a2a35, #1b1013); }
  #start[hidden] { display: none; }
  #start h1 { margin: 0; font-size: 22px; font-weight: 600; }
  #start p { margin: 0; max-width: 22em; color: #f3d9e2; }
  #go { padding: 12px 28px; border: 0; border-radius: 999px; background: #e0567f; color: #fff; font: 600 17px system-ui, sans-serif; cursor: pointer; }
  #go:disabled { opacity: .6; cursor: default; }
  #tip { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100vw - 32px);
    padding: 8px 14px; border-radius: 999px; background: #0009; color: #fff; text-align: center; transition: opacity .3s; pointer-events: none; }
  #tip.off { opacity: 0; }
  #hud { position: fixed; left: 8px; top: 8px; padding: 4px 8px; border-radius: 6px; background: #0008; white-space: pre; font: 12px/1.4 ui-monospace, monospace; display: none; }
  body.debug #hud { display: block; }
  #music { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 24px);
    padding: 7px 14px 7px 10px; border: 0; border-radius: 999px; background: #fffd; color: #6b3b4b; font: 500 13px/1.2 system-ui, sans-serif;
    box-shadow: 0 2px 10px #0004; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #music[hidden] { display: none; }
  #music:disabled { cursor: default; opacity: .55; filter: grayscale(1); }
  #music .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #music .icon { position: relative; width: 16px; height: 14px; flex: none; display: flex; align-items: flex-end; gap: 2px; }
  #music .bar { width: 3px; height: 4px; border-radius: 1px; background: #e0567f; }
  #music.playing .bar { animation: eq .9s ease-in-out infinite; }
  #music.playing .bar:nth-child(2) { animation-delay: -.3s; }
  #music.playing .bar:nth-child(3) { animation-delay: -.6s; }
  #music.playing .bar:nth-child(4) { animation-delay: -.45s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }
  #music:not(.playing) .bar { display: none; }
  #music:not(.playing) .icon::before { content: ''; position: absolute; left: 3px; top: 1px; border-style: solid;
    border-width: 6px 0 6px 10px; border-color: transparent transparent transparent #e0567f; }
  @media (prefers-reduced-motion: reduce) { #music.playing .bar { animation: none; height: 9px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
<script src="ar/lib/WebARRocksObject.js"></script>
</head>
<body>
<div id="wrap"><video id="video" playsinline muted></video><canvas id="gl"></canvas></div>
<canvas id="nn" width="512" height="512"></canvas>
<div id="hud"></div>
<div id="tip" class="off"></div>
<button id="music" type="button" hidden aria-label="背景音乐：muque - いいんじゃない（点击暂停或继续）">
  <span class="icon"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></span>
  <span class="label">muque - いいんじゃない</span>
</button>
<div id="start">
  <h1>樱花树 AR</h1>
  <p>把打印出来的樱花树放在桌上，手机举在它斜上方 15–25 厘米，让整棵树都在画面里。</p>
  <button id="go" type="button">打开相机</button>
  <p id="err"></p>
</div>
<script type="module">
// The animation (scene.js) on the printed tree, through the phone's camera.
//  - WebAR.rocks.object finds the tree in every frame with the network trained on it (ar/nn/NN_SAKURA.json);
//    ar/pose.js turns that into the tree's pose in camera space.
//  - The printed tree is the design (tree.glb) squeezed to 41 x 41 x 27 mm, so the design tree and scene.js go in one
//    group scaled like the print, centred on the tree's bounding box: nothing in scene.js changes.
//  - The design tree writes depth only, so the real tree hides what goes behind it; a copy of it and the table take
//    the animation's shadows (not the tree's own: the real tree has one).
//  - The light comes from where the real tree's shadow on the table says it does (ar/light.js); with no clear shadow
//    (soft light), the animation's shadows go faint. The image's brightness sets how bright the lights are.
// Query parameters: debug = 1 (the network's view, numbers); fov = the camera's field of view along the image's long side,
// degrees (default 63, a phone's main camera); nomusic = 1.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import setup from './scene.js';
import { treePose } from './ar/pose.js';
import { createLightEstimator } from './ar/light.js';

const qs = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
if (qs.get('debug')) document.body.classList.add('debug');
const LONG_FOV = +(qs.get('fov') || 63);
const PRINT = new THREE.Vector3(41 / 46.722, 27 / 33.02, 41 / 46.722);   // the print: across x 0.8775, height x 0.8177
const SONG_LENGTH = 93.27;
// as the WebAR.rocks.train player template uses networks from the trainer
const NN_OPTIONS = { notHereFactor: 0.0, paramsPerLabel: { SAKURA: { thresholdDetect: 1.0 } } };
const DETECT = { isKeepTracking: true, isSkipConfirmation: false, thresholdDetectFactor: 1.2, thresholdDetectFactorUnstitch: 0.5, trackingFactors: [0.6, 0.6, 0.6] };
const SCAN = { nScaleLevels: 3, overlapFactors: [3, 3, 3], scale0Factor: 0.5 };

// ---- 3D layer ----------------------------------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.005, 5);   // at the origin, looking down -z: camera space is world space

// anchor: the tree's bounding-box centre, posed every frame; stage: the design tree and the animation, scaled like the print
const anchor = new THREE.Group(); anchor.visible = false; scene.add(anchor);
const stage = new THREE.Group(); stage.name = 'stage'; anchor.add(stage);
stage.scale.copy(PRINT);

const hemi = new THREE.HemisphereLight('#fff6f2', '#b9a8a4', 1.6); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.position.set(0.05, 0.11, 0.07).multiplyScalar(3);   // as in index.html, relative to the tree
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -0.11, right: 0.11, top: 0.11, bottom: -0.11, near: 0.05, far: 0.9 });
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.0002;
anchor.add(sun, sun.target);

const gltf = await new GLTFLoader().loadAsync('tree.glb');
const tree = gltf.scene.getObjectByName('SakuraQR') || gltf.scene;
const info = tree.userData.sakuraqr;
stage.add(tree);
const box = new THREE.Box3().setFromObject(tree);
stage.position.set(0, -box.getCenter(new THREE.Vector3()).y * PRINT.y, 0);   // the anchor is the print's bounding-box centre
// the real tree hides what is behind it: the design tree writes depth only, before everything else
const hideMat = new THREE.MeshBasicMaterial({ colorWrite: false });
const debugMat = new THREE.MeshBasicMaterial({ color: '#40e0a0', transparent: true, opacity: 0.45, depthWrite: true });
tree.traverse(o => { if (o.isMesh) { o.material = qs.get('debug') ? debugMat : hideMat; o.renderOrder = -1; o.castShadow = false; } });
const anim = await setup({ THREE, stage, tree, info, mode: 'ar', showLength: SONG_LENGTH });
stage.traverse(o => { if (o.isMesh && !tree.getObjectById(o.id)) o.castShadow = true; });   // the animation casts shadows

// shadows on the real tree and on the table (shadow-only materials, drawn just in front of the depth they match);
// added after setup() so that scene.js only ever sees the one tree
const shadowMat = new THREE.ShadowMaterial({ opacity: 0.28, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
const treeShadow = tree.clone(); treeShadow.name = 'tree-shadow';
treeShadow.traverse(o => { if (o.isMesh) { o.material = shadowMat; o.receiveShadow = true; o.castShadow = false; o.renderOrder = 0; } });
const table = new THREE.Mesh(new THREE.CircleGeometry(0.2, 48), new THREE.ShadowMaterial({ opacity: 0.22 }));
table.rotation.x = -Math.PI / 2; table.position.y = -0.00005; table.receiveShadow = true;
stage.add(treeShadow, table);
const light = createLightEstimator({ tree, info, printScale: PRINT, stage });

// ---- layout: video and 3D layer share the video's shape, covering the screen ---------------------------------------
const video = $('video');
function layout() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const k = Math.max(innerWidth / vw, innerHeight / vh);
  Object.assign($('wrap').style, { width: vw * k + 'px', height: vh * k + 'px' });
  renderer.setSize(vw * k, vh * k, false);
  camera.aspect = vw / vh;
  // the field of view is given along the long side; three wants the vertical one
  const tl = Math.tan(LONG_FOV * Math.PI / 360);
  camera.fov = 2 * Math.atan(vw >= vh ? tl / camera.aspect : tl) * 180 / Math.PI;
  camera.updateProjectionMatrix();
}
addEventListener('resize', layout);

// ---- music (as in index.html) --------------------------------------------------------------------------------------
const music = { started: false, failed: false };
const bgm = qs.get('nomusic') ? null : new Audio('audio/bgm.m4a');
if (bgm) {
  const btn = $('music');
  bgm.loop = true;
  let sounding = false;
  const show = () => { btn.classList.toggle('playing', sounding && !bgm.paused); };
  bgm.addEventListener('playing', () => { sounding = true; music.started = true; show(); });
  bgm.addEventListener('pause', () => { sounding = false; show(); });
  bgm.addEventListener('error', () => { music.failed = true; sounding = false; show(); btn.disabled = true; });
  btn.addEventListener('click', () => { if (bgm.paused) bgm.play().catch(show); else bgm.pause(); });
  show();
}
const showTime = () => (bgm && music.started && !music.failed ? bgm.currentTime : undefined);

// ---- start: the camera needs a tap (and so does sound) --------------------------------------------------------------
const tip = text => { $('tip').textContent = text || ''; $('tip').classList.toggle('off', !text); };
$('go').addEventListener('click', async () => {
  $('go').disabled = true; $('err').textContent = '';
  if (bgm) { bgm.play().catch(() => {}); $('music').hidden = false; }
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    await video.play();
    await new Promise(ok => video.videoWidth ? ok() : video.addEventListener('loadedmetadata', ok, { once: true }));
    layout();
    await new Promise((ok, ko) => WEBARROCKSOBJECT.init({ canvas: $('nn'), video, isDebugRender: !!qs.get('debug'),
      callbackReady: e => e ? ko(new Error(e)) : ok() }));
    tip('正在加载识别模型…');
    await new Promise((ok, ko) => WEBARROCKSOBJECT.set_NN('ar/nn/NN_SAKURA.json', e => e ? ko(new Error(e)) : ok(), NN_OPTIONS));
    WEBARROCKSOBJECT.set_scanSettings(SCAN);
  } catch (e) {
    $('go').disabled = false;
    $('err').textContent = (e && e.name === 'NotAllowedError') ? '需要允许使用相机。' : '打不开相机或识别模型：' + (e && e.message || e);
    return;
  }
  $('start').hidden = true;
  tip('把镜头对准樱花树，离它 15–25 厘米');
  requestAnimationFrame(frame);
});

// ---- every frame: find the tree, follow it smoothly, animate, draw -------------------------------------------------
const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), UP = new THREE.Vector3();
// the sun: towards the light the real shadow shows (tree space), held while the shadow is out of view;
// hard while a shadow stands out, soft (faint shadows) when none does
const sunDir = new THREE.Vector3(0.05, 0.11, 0.07).normalize(), HARD = 0.12;
let lastLight = 0, est = null, softness = 0;
function relight(e) {
  est = e;
  const k = THREE.MathUtils.clamp(light.brightness / 0.45, 0.6, 1.3);   // the scene's exposure
  const hard = !!(e && e.contrast > HARD);
  if (hard) sunDir.lerp(e.phys, 0.35).normalize();
  softness += ((hard ? 0 : 1) - softness) * 0.3;
  sun.position.copy(sunDir).multiplyScalar(0.3);
  sun.intensity = 2.2 * k * (1 - 0.45 * softness);
  hemi.intensity = 1.6 * k * (1 + 0.35 * softness);
  shadowMat.opacity = 0.28 * (1 - 0.6 * softness);
  table.material.opacity = 0.22 * (1 - 0.6 * softness);
}
let last = performance.now(), elapsed = 0, seen = -1e9, found = false, fps = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; elapsed += dt; fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  const d = WEBARROCKSOBJECT.detect(0, null, DETECT);
  if (d.label) {
    treePose(d, camera.fov, camera.aspect, pos, quat);
    if (!found || now - seen > 600) { anchor.position.copy(pos); anchor.quaternion.copy(quat); }   // (re)found: jump there
    else {   // follow, smoothing out the jitter between frames
      const k = 1 - Math.exp(-dt * 14);
      anchor.position.lerp(pos, k); anchor.quaternion.slerp(quat, k);
    }
    seen = now; found = true;
  }
  const visible = now - seen < 700;   // keep it a moment through short dropouts
  if (visible !== anchor.visible) { anchor.visible = visible; tip(visible ? '' : '把镜头对准樱花树，离它 15–25 厘米'); }
  // the sky stays above the tree: the hemisphere light points along the tree's up
  hemi.position.copy(UP.set(0, 1, 0).applyQuaternion(anchor.quaternion));
  if (visible && now - lastLight > 300) { lastLight = now; relight(light.estimate(video, camera)); }
  anim.update(dt, elapsed, showTime());
  renderer.render(scene, camera);
  if (qs.get('debug')) $('hud').textContent = `fps ${fps.toFixed(0)}  ${d.label ? 'tree' : '—'}  score ${d.detectScore.toFixed(2)}\n` +
    `distance ${(-anchor.position.z * 100).toFixed(1)} cm  yaw ${(d.yaw * 57.3).toFixed(0)}°  pitch ${(d.pitch * 57.3).toFixed(0)}°  roll ${(d.roll * 57.3).toFixed(0)}°\n` +
    `video ${video.videoWidth}×${video.videoHeight}  fov ${camera.fov.toFixed(1)}° (vertical)\n` +
    `light ${est ? `az ${est.az}° el ${est.el}° contrast ${est.contrast.toFixed(2)}${est.contrast > HARD ? '' : ' (soft)'}` : '—'}  brightness ${light.brightness.toFixed(2)}`;
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
