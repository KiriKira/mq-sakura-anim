<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakura QR animation</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4ede9; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; bottom: 8px; color: #6b4b4b; background: #fffc; padding: 4px 8px; border-radius: 6px; white-space: pre; }
  #music { position: fixed; top: 12px; right: 12px; display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 24px);
    padding: 7px 14px 7px 10px; border: 0; border-radius: 999px; background: #fffd; color: #6b3b4b; font: 500 13px/1.2 system-ui, sans-serif;
    box-shadow: 0 2px 10px #b0707033; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #music[hidden] { display: none; }
  #music:hover { background: #fff; }
  #music:disabled { cursor: default; opacity: .6; }
  #music .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #music .icon { position: relative; width: 16px; height: 14px; flex: none; display: flex; align-items: flex-end; gap: 2px; }
  #music .bar { width: 3px; height: 4px; border-radius: 1px; background: #e0567f; }
  #music.playing .bar { animation: eq .9s ease-in-out infinite; }
  #music.playing .bar:nth-child(2) { animation-delay: -.3s; }
  #music.playing .bar:nth-child(3) { animation-delay: -.6s; }
  #music.playing .bar:nth-child(4) { animation-delay: -.45s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }
  #music:not(.playing) .bar { display: none; }
  #music:not(.playing) .icon::before { content: ''; position: absolute; left: 3px; top: 1px; border-style: solid;
    border-width: 6px 0 6px 10px; border-color: transparent transparent transparent #e0567f; }
  @media (prefers-reduced-motion: reduce) { #music.playing .bar { animation: none; height: 9px; } }
</style>
<!-- three 0.170.0 from node_modules (npm install), no CDN -->
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"></div>
<button id="music" type="button" hidden aria-label="背景音乐：muque - いいんじゃない（点击暂停或继续）" title="点击暂停 / 继续">
  <span class="icon"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></span>
  <span class="label">muque - いいんじゃない</span>
</button>
<script type="module">
// Demo host for scene.js (also what test/shots.mjs drives). Query parameters:
//   view = ne | nw | se | sw | top   camera preset (default wide, then free orbit); w0 | w1 | w2 | group close-up of the walkers;
//          wide: further out and higher, to see the whale
//   t    = song time to start at: fast-forwards with fixed 1/30 s steps (default 0)
//   nomusic = 1                       no background music; the show runs on scene.js's own clock
//   pause = 1                         stop the clock after fast-forwarding (for screenshots)
//   test = 1                          run the self-check (see check() below) and put the result in window.__report
//   mode = 3d | ar                    passed through to setup()
//   tree = path of the tree GLB (default tree.glb)
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import setup from './scene.js';

const qs = new URLSearchParams(location.search);
const hud = document.getElementById('hud');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f4ede9');
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.002, 2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.014, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight('#fff6f2', '#b9a8a4', 1.6));
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.position.set(0.05, 0.11, 0.07);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -0.05, right: 0.05, top: 0.05, bottom: -0.05, near: 0.01, far: 0.3 });
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.0002;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(0.2, 48), new THREE.MeshStandardMaterial({ color: '#efe3dd', roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.00005;
ground.receiveShadow = true;
scene.add(ground);

const VIEWS = {
  ne: [1, 1], nw: [-1, 1], se: [1, -1], sw: [-1, -1]
};
function placeCamera(view) {
  if (view === 'wide') {
    controls.target.set(0, 0.03, 0);
    camera.position.set(0.21, 0.13, 0.25);
    camera.lookAt(controls.target); controls.update();
    return;
  }
  const d = 0.135;
  if (view === 'top') { camera.position.set(0, d * 1.05, 0.00001); controls.target.set(0, 0, 0); }
  else {
    const [sx, sz] = VIEWS[view] || VIEWS.ne, e = 30 * Math.PI / 180;
    camera.position.set(sx * d * Math.cos(e) * Math.SQRT1_2, 0.014 + d * Math.sin(e), sz * d * Math.cos(e) * Math.SQRT1_2);
  }
  camera.lookAt(controls.target);
  controls.update();
}
placeCamera(qs.get('view') || 'wide');

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

const stage = new THREE.Group();
stage.name = 'stage';
scene.add(stage);

const gltf = await new GLTFLoader().loadAsync(qs.get('tree') || 'tree.glb');
const tree = gltf.scene.getObjectByName('SakuraQR') || gltf.scene;
tree.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
stage.add(tree);
const info = tree.userData.sakuraqr;

const SONG_LENGTH = 93.27;   // seconds; the show loops with the song
let anim = await setup({ THREE, stage, tree, info, mode: qs.get('mode') || '3d', showLength: SONG_LENGTH });

// ---- background music -------------------------------------------------------------------------------------------
// Loops audio/bgm.m4a (muque「いいんじゃない」, 93.3 s) and drives the show from its position. Browsers only allow sound after the viewer has
// interacted with the page, so if autoplay is refused the button waits in the paused state for a tap; until the song
// has started once, the show runs on scene.js's own clock. Paused, the story holds where the song is.
const music = { started: false, ok: false };
const bgm = qs.get('nomusic') || qs.get('test') ? null : new Audio('audio/bgm.m4a');
const btn = document.getElementById('music');
window.__bgm = bgm; window.__stage = stage;   // for test/shots.mjs
if (bgm) {
  bgm.loop = true;
  bgm.preload = 'auto';
  const show = () => { btn.classList.toggle('playing', !bgm.paused); btn.title = bgm.paused ? '点击继续播放' : '点击暂停'; };
  bgm.addEventListener('play', () => { music.started = true; show(); });
  bgm.addEventListener('pause', show);
  bgm.addEventListener('canplay', () => { music.ok = true; btn.hidden = false; }, { once: true });
  bgm.addEventListener('error', () => { btn.hidden = true; music.ok = false; });
  btn.addEventListener('click', () => { if (bgm.paused) bgm.play().catch(() => {}); else bgm.pause(); });
  bgm.play().catch(() => show());        // autoplay refused: wait for a tap
}
const showTime = () => (bgm && music.started && music.ok ? bgm.currentTime : undefined);

// timing of update()
const times = [];
function timedUpdate(dt, elapsed, show) {
  const t0 = performance.now();
  anim.update(dt, elapsed, show);
  times.push(performance.now() - t0);
}

let elapsed = 0;
const ff = +(qs.get('t') || 0);
const report = { errors: [] };
if (qs.get('test')) Object.assign(report, await check());
else for (; elapsed < ff; elapsed += 1 / 30) timedUpdate(1 / 30, elapsed, elapsed);

// view = w0 | w1 | w2: close-up of one walker; group: all three. Seen from outside the tree, looking in.
const wv = /^w(\d)$|^group$/.exec(qs.get('view') || '');
if (wv) {
  const walkers = [];
  const whaleObj = stage.getObjectByName('whale');
  stage.traverse(o => { if (o.isSkinnedMesh && !(whaleObj && whaleObj.getObjectById(o.id))) walkers.push(o.parent); });
  stage.updateMatrixWorld(true);
  const list = wv[1] !== undefined ? [walkers[+wv[1]]] : walkers;
  const p = new THREE.Vector3();
  for (const w of list) p.add(w.getWorldPosition(new THREE.Vector3()));
  p.divideScalar(list.length);
  const out = new THREE.Vector3(p.x, 0, p.z).normalize();
  const side = new THREE.Vector3(-out.z, 0, out.x);
  const d = list.length > 1 ? 0.034 : 0.022;
  controls.target.copy(p).add(new THREE.Vector3(0, 0.0035, 0));
  camera.position.copy(p).addScaledVector(out, d).addScaledVector(side, d * 0.35).add(new THREE.Vector3(0, d * 0.28, 0));
  camera.lookAt(controls.target); controls.update();
}
// ---- camera director ----------------------------------------------------------------------------------------------
// When the three stop to watch the whale, the camera glides (2 s) to a spot 45 degrees counter-clockwise of them
// round the trunk (seen from above), looking down at them from 45 degrees above, and drifts a little while they watch
// (the whale arrives 25 degrees clockwise of them, so they see it across open sky). When they run off it glides
// back. If the canopy would hide any of them, the camera rises until it doesn't. Dragging the view cancels the shot
// until the next one. Off with ?view= or ?test=.
const director = { on: !qs.get('view') && !qs.get('test'), phase: 'idle', t: 0, cancelled: false, first: true };
const animRoot = () => stage.getObjectByName('SakuraQR-animation');
const runnerObjs = () => {
  const whaleObj = stage.getObjectByName('whale'), list = [];
  stage.traverse(o => { if (o.isSkinnedMesh && !(whaleObj && whaleObj.getObjectById(o.id))) list.push(o.parent); });
  return list;
};
const SHOT = { reach: 0.036, around: -Math.PI / 4, elevation: Math.PI / 4, drift: -0.1, glide: 2 };
const trunkAt = new THREE.Vector3(info.trunk.centre[0], 0, info.trunk.centre[1]);   // the tree sits at the stage origin
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
controls.addEventListener('start', () => { if (director.phase !== 'idle') { director.phase = 'idle'; director.cancelled = true; } });
const treeSolids = [];
tree.traverse(o => { if (o.isMesh) treeSolids.push(o); });
const sightRay = new THREE.Raycaster();
function clearSight(from, to) {
  const d = to.clone().sub(from), len = d.length();
  sightRay.set(from, d.normalize()); sightRay.far = len;
  return !sightRay.intersectObjects(treeSolids, false).length;
}
function runnersCentre(objs) {
  const c = new THREE.Vector3();
  for (const o of objs) c.add(o.getWorldPosition(new THREE.Vector3()));
  return c.divideScalar(objs.length || 1);
}
// camera for the shot: round the trunk by `around` from the runners, `reach` away from them horizontally, raised so
// it looks down at them at `elevation`
function shotPose(around, elevation) {
  const objs = runnerObjs(), c = runnersCentre(objs);
  const r = Math.hypot(c.x - trunkAt.x, c.z - trunkAt.z), a = Math.atan2(c.z - trunkAt.z, c.x - trunkAt.x) + around;
  // the point at angle a from the trunk that is `reach` from the runners: |R u - r v| = reach, angle(u, v) = around
  const R = r * Math.cos(around) + Math.sqrt(Math.max(0, SHOT.reach * SHOT.reach - Math.pow(r * Math.sin(around), 2)));
  const pos = new THREE.Vector3(trunkAt.x + R * Math.cos(a), 0, trunkAt.z + R * Math.sin(a));
  pos.y = c.y + Math.hypot(pos.x - c.x, pos.z - c.z) * Math.tan(elevation);
  return { target: c.clone().add(new THREE.Vector3(0, 0.003, 0)), pos };
}
function direct(dt) {
  if (!director.on) return;
  const runners = (animRoot() && animRoot().userData.runners) || [];
  const watching = runners.some(r => r.mode === 'watch');
  if (!watching) director.cancelled = false;
  const d = director;
  if (d.phase === 'idle' && watching && !d.cancelled) {
    d.saved = { pos: camera.position.clone(), target: controls.target.clone() };
    // 45 degrees up; higher if the canopy is in the way of any of them (checked over the drift too)
    const objs = runnerObjs();
    d.elevation = SHOT.elevation;
    for (; d.elevation < 1.4; d.elevation += 0.08) {
      const ok = [0, SHOT.drift].every(dr => { const p = shotPose(SHOT.around + dr, d.elevation);
        return objs.every(o => clearSight(o.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.003, 0)), p.pos)); });
      if (ok) break;
    }
    d.phase = d.first ? 'hold' : 'in'; d.t = 0;          // already mid-shot when the page opens: cut straight to it
  }
  d.first = false;
  if (d.phase === 'idle') return;
  d.t += dt;
  const shot = shotPose(SHOT.around + SHOT.drift * Math.min(1, d.t / 9), d.elevation);
  if (d.phase === 'in') {
    const k = easeInOut(Math.min(1, d.t / SHOT.glide));
    camera.position.lerpVectors(d.saved.pos, shot.pos, k); controls.target.lerpVectors(d.saved.target, shot.target, k);
    if (k >= 1) d.phase = 'hold';
  } else if (d.phase === 'hold') {
    camera.position.copy(shot.pos); controls.target.copy(shot.target);
    if (!watching) { d.phase = 'out'; d.t = 0; d.from = { pos: camera.position.clone(), target: controls.target.clone() }; }
  } else if (d.phase === 'out') {
    const k = easeInOut(Math.min(1, d.t / SHOT.glide));
    camera.position.lerpVectors(d.from.pos, d.saved.pos, k); controls.target.lerpVectors(d.from.target, d.saved.target, k);
    if (k >= 1) d.phase = 'idle';
  }
  camera.lookAt(controls.target);
  window.__director = d.phase;
}

const paused = !!qs.get('pause');
let last = performance.now(), frames = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (!paused) { elapsed += dt; timedUpdate(dt, elapsed, showTime()); }
  direct(dt);
  controls.update();
  renderer.render(scene, camera);
  if (++frames === 3) {
    const r = renderer.info.render;
    report.drawCalls = r.calls; report.triangles = r.triangles;
    const sorted = times.slice().sort((a, b) => a - b);
    report.slowest = times.map((t, i) => [t, i]).sort((a, b) => b[0] - a[0]).slice(0, 5);
    report.updateMs = { calls: times.length, median: sorted[sorted.length >> 1], p95: sorted[Math.floor(sorted.length * 0.95)], max: sorted[sorted.length - 1] };
    window.__report = report;
    window.__ready = true;
    hud.textContent = `draw calls ${r.calls} · triangles ${r.triangles} · update ${report.updateMs.median.toFixed(3)} ms (p95 ${report.updateMs.p95.toFixed(3)})`;
  }
});

// ---- self-check ---------------------------------------------------------------------------------------------------
// Runs the animation for 90 s with 1/30 s steps and every 3 s tests, independently of scene.js's own collision grid:
//  * every walker vertex (after skinning) and every corner of every visible petal: is it inside the tree?
//    (a ray straight up from the point, counted against the tree's triangles from both sides: odd = inside)
//  * is everything within the plate plus 3 cubes and above y = 0, do the walkers stay on the plate?
//  * do two walkers ever come closer than their radii allow?
async function check() {
  stage.getObjectByName('SakuraQR-animation').userData.stats.where = [];
  const out = { samples: 0, points: 0, insideTree: [], outOfBounds: [], offPlate: [], walkerOverlap: 0, showErrors: [], timeline: [], whaleLowest: Infinity, whaleReach: 0, whaleVsRunners: [], petalsAboveCanopy: 0, aboveCanopy: [], petalsFloating: 0, floating: [], petalsLanded: { plate: 0, canopy: 0 } };
  const solid = [];
  tree.updateMatrixWorld(true);
  tree.traverse(o => {
    if (!o.isMesh) return;
    const m = new THREE.Mesh(o.geometry, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
    m.matrixAutoUpdate = false; m.matrix.copy(o.matrixWorld); m.matrixWorld.copy(o.matrixWorld);
    solid.push(m);
  });
  const ray = new THREE.Raycaster();
  const dir = new THREE.Vector3(0.0013, 1, 0.0021).normalize();
  const inside = p => { ray.set(p, dir); return ray.intersectObjects(solid, false).length % 2 === 1; };
  const cell = info.cell, half = info.plate.size / 2, lim = half + 3 * cell;
  const root = stage.getObjectByName('SakuraQR-animation');
  const petals = root.getObjectByName('petals');
  const corners = [];
  for (const x of [-0.25, 0.25]) for (const y of [-0.03, 0.03]) for (const z of [-0.25, 0.25]) corners.push(new THREE.Vector3(x, y, z));
  const m4 = new THREE.Matrix4(), v = new THREE.Vector3(), seen = new Set();
  const prevPos = [];
  const note = (list, what) => { if (list.length < 20) list.push(what); };
  const walkers = [];
  let whaleMesh = null;
  root.getObjectByName('whale').traverse(o => { if (o.isMesh) whaleMesh = o; });
  root.traverse(o => { if (o.isSkinnedMesh && o !== whaleMesh) walkers.push(o); });
  out.walkersShown = walkers.length === 3 && walkers.every(w => w.parent.visible);

  for (let step = 0; step <= 90 * 30; step++) {
    if (step) { elapsed += 1 / 30; timedUpdate(1 / 30, elapsed, elapsed); }   // song time = elapsed
    if (step % 90 === 89) {                   // remember where every petal is, one frame before each sample
      for (let i = 0; i < petals.count; i++) { petals.getMatrixAt(i, m4); m4.premultiply(petals.matrixWorld); prevPos[i] = [m4.elements[12], m4.elements[13], m4.elements[14]]; }
    }
    if (step % 90) continue;
    out.samples++;
    stage.updateMatrixWorld(true);
    for (const w of walkers) {
      w.skeleton.update();
      seen.clear();
      const pos = w.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        w.getVertexPosition(i, v); w.localToWorld(v);
        const k = v.x.toFixed(6) + v.y.toFixed(6) + v.z.toFixed(6);
        if (seen.has(k)) continue; seen.add(k);
        out.points++;
        if (Math.abs(v.x) > lim || Math.abs(v.z) > lim || v.y < 0) note(out.outOfBounds, [w.name, step / 30, v.toArray()]);
        if (v.y < info.plate.top + 0.02 * cell && (Math.abs(v.x) > half || Math.abs(v.z) > half)) note(out.offPlate, [w.name, step / 30, v.toArray()]);
        if (inside(v)) note(out.insideTree, [w.name, step / 30, v.toArray().map(n => +(n / cell).toFixed(2))]);
      }
    }
    // the show: the whale is up from 17 s to 63 s; the runners look at it from ~21 to ~28.5 s, run before and after,
    // and hop from ~64 s
    const t = elapsed, whale = root.getObjectByName('whale');
    const whaleUp = whale.visible;
    if (whaleUp !== (t >= 17 && t < 62.9)) note(out.showErrors, ['whale visible ' + whaleUp, +t.toFixed(2)]);
    const expect = t >= 21.5 && t <= 28.5 ? 'look' : t >= 64 ? 'hop' : (t < 19.4 || (t >= 30 && t < 63)) ? 'run' : null;
    const runners = root.userData.runners || [];
    runners.forEach((r, i) => {
      if (expect && r.act !== expect) note(out.showErrors, ['runner ' + i + ' ' + r.act + ' (expected ' + expect + ')', +t.toFixed(2)]);
      if (expect === 'look' && r.v > 0.01) note(out.showErrors, ['runner ' + i + ' moving while watching', +t.toFixed(2)]);
    });
    out.timeline.push([+t.toFixed(1), whaleUp ? 'whale' : '-', runners.map(r => r.act).join(',')]);
    if (expect === 'look' && whaleUp) {            // while watching, each of them must be able to see the whale
      const wp = whale.getWorldPosition(new THREE.Vector3()), plan = root.userData.whalePlan;
      for (const w of walkers) {
        const eye = w.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 3.5 * cell, 0));
        const d = wp.clone().sub(eye), len = d.length();
        ray.set(eye, d.normalize()); ray.far = len;
        if (ray.intersectObjects(solid, false).length) note(out.showErrors, [w.name + ' cannot see the whale', +t.toFixed(2)]);
        ray.far = Infinity;
      }
      out.whaleVsRunners.push([+t.toFixed(1), +(((plan.whale - plan.runners) * 180 / Math.PI + 540) % 360 - 180).toFixed(1)]);
    }
    if (whaleUp && whaleMesh) {                     // the whale: never in the tree, never past plate + 3 cubes
      whaleMesh.skeleton && whaleMesh.skeleton.update();
      seen.clear();
      const pos = whaleMesh.geometry.attributes.position;
      let low = Infinity;
      for (let i = 0; i < pos.count; i++) {
        whaleMesh.getVertexPosition(i, v); whaleMesh.localToWorld(v);
        const k = v.x.toFixed(6) + v.y.toFixed(6) + v.z.toFixed(6);
        if (seen.has(k)) continue; seen.add(k);
        out.points++;
        low = Math.min(low, v.y);
        // the whale may go beyond plate + 3 cubes, but only as far as its own circle (plus fins) takes it
        const orbit = root.userData.whaleOrbit, dx = v.x / cell - orbit.centre[0], dz = v.z / cell - orbit.centre[1];
        if (Math.hypot(dx, dz) > orbit.reach + 1.5 || v.y < 0) note(out.outOfBounds, ['whale', +t.toFixed(2), v.toArray().map(n => +(n / cell).toFixed(2))]);
        out.whaleReach = Math.max(out.whaleReach, Math.hypot(dx, dz));
        if (inside(v)) note(out.insideTree, ['whale', +t.toFixed(2), v.toArray().map(n => +(n / cell).toFixed(2))]);
      }
      out.whaleLowest = Math.min(out.whaleLowest, low / cell);
    }
    for (let a = 0; a < walkers.length; a++) for (let b = a + 1; b < walkers.length; b++) {
      const pa = new THREE.Vector3(), pb = new THREE.Vector3();
      walkers[a].getWorldPosition(pa); walkers[b].getWorldPosition(pb);
      if (pa.distanceTo(pb) < 2.2 * cell) out.walkerOverlap++;
    }
    for (let i = 0; i < petals.count; i++) {
      petals.getMatrixAt(i, m4);
      if (m4.elements[0] === 0 && m4.elements[1] === 0 && m4.elements[2] === 0) continue;   // hidden (scale 0)
      m4.premultiply(petals.matrixWorld);
      for (const c of corners) {
        v.copy(c).applyMatrix4(m4);
        out.points++;
        if (Math.abs(v.x) > lim || Math.abs(v.z) > lim || v.y < 0) note(out.outOfBounds, ['petal ' + i, step / 30, v.toArray()]);
        if (inside(v)) note(out.insideTree, ['petal ' + i, step / 30, v.toArray().map(n => +(n / cell).toFixed(2))]);
      }
      const e = m4.elements;
      const pp = prevPos[i], still = pp && pp[0] === e[12] && pp[1] === e[13] && pp[2] === e[14];
      if (!still) {                                                        // moving → in the air: not above the canopy top near it
        const g = info.grid, col = Math.floor((e[12] - g.origin[0]) / cell), row = Math.floor((e[14] - g.origin[1]) / cell);
        let top = 0;
        for (let r = row - 2; r <= row + 2; r++) for (let c = col - 2; c <= col + 2; c++) if (g.surface[r] && g.surface[r][c] > top) top = g.surface[r][c];
        if (top > 1 && e[13] / cell > top) { out.petalsAboveCanopy++; note(out.aboveCanopy, ['petal ' + i, step / 30, [e[12] / cell, e[13] / cell, e[14] / cell].map(n => +n.toFixed(2)), top]); }
      }
      if (still && Math.abs(e[5]) > 0.99 * Math.hypot(e[4], e[5], e[6])) {        // lying flat and not moving → resting
        const y = e[13] / cell;
        if (y < info.plate.top / cell + 0.1) out.petalsLanded.plate++; else out.petalsLanded.canopy++;
        // something must be right under its middle: a ray straight down from the centre hits the tree within reach
        ray.set(new THREE.Vector3(e[12], e[13], e[14]), new THREE.Vector3(0.0011, -1, 0.0017).normalize());
        ray.far = 0.1 * cell;
        if (!ray.intersectObjects(solid, false).length) { out.petalsFloating++; note(out.floating, ['petal ' + i, step / 30, [e[12] / cell, e[13] / cell, e[14] / cell].map(n => +n.toFixed(2))]); }
        ray.far = Infinity;
      }
    }
    await new Promise(r => setTimeout(r));
  }
  out.petalStats = Object.assign({}, root.userData.stats);
  // dispose() must leave the stage as it found it; then set up again (same seed, same start)
  anim.dispose();
  out.stageAfterDispose = stage.children.map(o => o.name);
  anim = await setup({ THREE, stage, tree, info, mode: qs.get('mode') || '3d' });
  return out;
}

addEventListener('error', e => report.errors.push(String(e.message)));
</script>
