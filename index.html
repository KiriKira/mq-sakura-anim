<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakura QR animation</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4ede9; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; }
  body.ar { background: #111; }
  canvas { display: block; }
  /* the 3D view; in AR the camera image under it, both with the video's shape, covering the screen (cropped) */
  #wrap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 100vw; height: 100vh; }
  #wrap video, #wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #wrap video { display: none; }
  body.ar #wrap video { display: block; }
  #nn { position: fixed; right: 8px; bottom: 8px; width: 160px; height: 160px; opacity: .85; display: none !important; }
  body.ar.debug #nn { display: block !important; }   /* (the AR runtime sets its own display) */
  #hud { position: fixed; left: 8px; bottom: 8px; color: #6b4b4b; background: #fffc; padding: 4px 8px; border-radius: 6px; white-space: pre; display: none; }
  body.debug #hud { display: block; }
  body.ar #hud { color: #fff; background: #0008; font: 12px/1.4 ui-monospace, monospace; }
  /* top left: 3D <-> AR */
  #mode { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); display: flex; align-items: center; gap: 7px;
    padding: 7px 14px 7px 10px; border: 0; border-radius: 999px; background: #fffd; color: #6b3b4b; font: 600 13px/1.2 system-ui, sans-serif;
    box-shadow: 0 2px 10px #b0707033; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #mode:hover { background: #fff; }
  #mode:disabled { cursor: progress; opacity: .7; }
  #mode svg { width: 18px; height: 18px; flex: none; fill: none; stroke: #e0567f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  body.ar #mode, body.ar #music, body.ar #quality { box-shadow: 0 2px 10px #0004; }
  /* AR only, next to it: the camera's resolution, tap for the next one */
  #quality { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(84px + env(safe-area-inset-left)); display: none;
    padding: 7px 12px; border: 0; border-radius: 999px; background: #fffd; color: #6b3b4b; font: 600 13px/1.2 system-ui, sans-serif;
    cursor: pointer; -webkit-tap-highlight-color: transparent; white-space: nowrap; }
  body.ar #quality { display: block; }
  #quality:disabled { cursor: progress; opacity: .7; }
  #tip { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100vw - 32px);
    padding: 8px 14px; border-radius: 999px; background: #0009; color: #fff; text-align: center; font-size: 14px; transition: opacity .3s; pointer-events: none; }
  #tip.off { opacity: 0; }
  body.rec #tip { bottom: calc(104px + env(safe-area-inset-bottom)); }
  /* ?rec: the record button, bottom centre; while recording a ring shows how much of the song is left */
  #rec { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: 68px; height: 68px;
    border: 0; border-radius: 50%; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
    background: conic-gradient(#e0567f calc(var(--p, 0) * 1turn), #fffd 0); box-shadow: 0 2px 12px #0004; }
  #rec[hidden] { display: none; }
  #rec::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: #e0567f; border: 3px solid #fff; transition: inset .2s, border-radius .2s; }
  #rec.on::before { inset: 21px; border-radius: 5px; border: 0; }
  #rec:disabled { opacity: .45; cursor: default; }
  #rec .time { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); padding: 3px 10px; border-radius: 999px;
    background: #e0567f; color: #fff; font: 600 13px/1.3 ui-monospace, monospace; white-space: nowrap; }
  #rec:not(.on) .time { display: none; }
  #saved { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: #0008; }
  #saved[hidden] { display: none; }
  #saved .card { display: flex; flex-direction: column; gap: 12px; width: min(360px, 100%); max-height: 100%; padding: 14px; border-radius: 16px; background: #fff; color: #6b3b4b; box-sizing: border-box; }
  #saved video { width: 100%; min-height: 0; flex: 1 1 auto; max-height: 60vh; border-radius: 10px; background: #000; object-fit: contain; }
  #saved .row { display: flex; gap: 8px; }
  #saved .row > * { flex: 1; padding: 10px 0; border: 0; border-radius: 999px; background: #f4e3e8; color: #6b3b4b; font: 600 15px system-ui, sans-serif;
    text-align: center; text-decoration: none; cursor: pointer; }
  #saved .row > .main { background: #e0567f; color: #fff; }
  #saved .row > [hidden] { display: none; }
  #saved .note { margin: 0; font-size: 12px; color: #9a7b85; text-align: center; }
  #music { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 150px);
    padding: 7px 14px 7px 10px; border: 0; border-radius: 999px; background: #fffd; color: #6b3b4b; font: 500 13px/1.2 system-ui, sans-serif;
    box-shadow: 0 2px 10px #b0707033; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #music[hidden] { display: none; }
  #music:hover { background: #fff; }
  #music:disabled { cursor: default; opacity: .55; filter: grayscale(1); box-shadow: none; }
  #music .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #music .icon { position: relative; width: 16px; height: 14px; flex: none; display: flex; align-items: flex-end; gap: 2px; }
  #music .bar { width: 3px; height: 4px; border-radius: 1px; background: #e0567f; }
  #music.playing .bar { animation: eq .9s ease-in-out infinite; }
  #music.playing .bar:nth-child(2) { animation-delay: -.3s; }
  #music.playing .bar:nth-child(3) { animation-delay: -.6s; }
  #music.playing .bar:nth-child(4) { animation-delay: -.45s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }
  #music:not(.playing) .bar { display: none; }
  #music:not(.playing) .icon::before { content: ''; position: absolute; left: 3px; top: 1px; border-style: solid;
    border-width: 6px 0 6px 10px; border-color: transparent transparent transparent #e0567f; }
  /* first-visit hint: a hand-drawn arrow looping up to the music button, until the first tap */
  #hint { position: fixed; top: 46px; right: 58px; width: min(150px, 34vw); pointer-events: none; color: #e0567f;
    transition: opacity .35s; filter: drop-shadow(0 1px 0 #fff) drop-shadow(0 0 3px #fff); }
  #hint[hidden] { display: block; opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
  #hint svg { display: block; width: 100%; height: auto; overflow: visible; animation: bob 2.4s ease-in-out 1.4s infinite; }
  #hint .stroke { fill: none; stroke: currentColor; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.2s ease-out .4s forwards; }
  #hint .head { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .35s ease-out 1.5s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(5px, -5px); } }
  @media (prefers-reduced-motion: reduce) {
    #music.playing .bar { animation: none; height: 9px; }
    #hint svg { animation: none; }
    #hint .stroke { animation: none; stroke-dashoffset: 0; }
  }
</style>
<!-- three 0.170.0 from node_modules (npm install), no CDN -->
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="wrap"><video id="video" playsinline muted></video></div>
<canvas id="nn" width="512" height="512"></canvas>
<div id="hud"></div>
<div id="tip" class="off"></div>
<button id="mode" type="button" aria-label="切换到 AR：用相机看打印出来的树">
  <svg viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M12 7.5l4 2.25v4.5L12 16.5l-4-2.25v-4.5z M8 9.75l4 2.25 4-2.25 M12 12v4.5"/></svg>
  <span class="label">AR</span>
</button>
<button id="quality" type="button" aria-label="相机画质（点击切换）" title="相机画质：点击切换 720p / 1080p / 4K">画质</button>
<button id="rec" type="button" hidden aria-label="录像：从头录完一首歌"><span class="time"></span></button>
<div id="saved" hidden>
  <div class="card">
    <video id="clip" controls playsinline></video>
    <div class="row"><a id="save" class="main" download>保存视频</a><button id="share" type="button" hidden>分享</button><button id="close" type="button">关闭</button></div>
    <p class="note" id="clipinfo"></p>
  </div>
</div>
<div id="hint" hidden aria-hidden="true">
  <svg viewBox="0 0 200 140">
    <path class="stroke" d="M8 128 C 40 131, 72 114, 92 96 C 116 74, 126 46, 107 42 C 88 38, 70 68, 90 84 C 114 102, 152 62, 186 13"/>
    <path class="stroke head" d="M165 14 L187 11 L186 34"/>
  </svg>
</div>
<button id="music" type="button" hidden aria-label="背景音乐：muque - いいんじゃない（点击暂停或继续）" title="点击暂停 / 继续">
  <span class="icon"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></span>
  <span class="label">muque - いいんじゃない</span>
</button>
<script type="module">
// The page: the 3D animation, and (button at the top left) the same animation in AR on the printed tree, through the
// phone's camera (ar/mode.js, loaded on first use). Also what test/shots.mjs drives. Query parameters:
//   view = ne | nw | se | sw | top   camera preset (default wide, then free orbit); w0 | w1 | w2 | group close-up of the walkers;
//          wide: further out and higher, to see the whale
//   t    = song time to start at: fast-forwards with fixed 1/30 s steps (default 0)
//   nomusic = 1                       no background music; the show runs on scene.js's own clock
//   pause = 1                         stop the clock after fast-forwarding (for screenshots)
//   test = 1                          run the self-check (see check() below) and put the result in window.__report
//   tree = path of the tree GLB (default tree.glb)
//   ar = 1                            open in AR (the camera asks for permission straight away)
//   rec = 1                           a record button: one time through the song, picture and sound (rec.js)
//   debug = 1                         numbers; in AR the occluding tree in green and the network's view
//   fov = degrees                     AR: the camera's field of view along the image's long side (default 63, a phone's main camera)
//   refine = 0                        AR: the network's pose only, without the second pass
//   cam = 720 | 1080 | 2160           AR: the camera's resolution (short side) to start with; the button next to 3D changes it
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import setup from './scene.js';

const qs = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const hud = $('hud');
let hud3d = '';   // the 3D view's numbers (debug), back when leaving AR
let mode = '3d', ar = null, recorder = null;   // '3d' | 'ar'; ar: the AR mode once loaded (ar/mode.js); recorder: ?rec (rec.js)
const DEBUG = !!(qs.get('debug') || qs.get('test'));
if (DEBUG) document.body.classList.add('debug');

const wrap = $('wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f4ede9');
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.002, 2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.014, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight('#fff6f2', '#b9a8a4', 1.6));
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
// far out along the same direction, so the whale still casts a shadow while it climbs high
sun.position.set(0.05, 0.11, 0.07).multiplyScalar(3);
sun.castShadow = true;
// the shadow covers the whale's circle (radius ~4.7 cm) and where its shadow falls, not just the tree;
// 2048 texels over 22 cm is ~0.1 mm, under a tenth of a tree cube (4096 would cost phones ~64 MB)
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -0.11, right: 0.11, top: 0.11, bottom: -0.11, near: 0.05, far: 0.9 });
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.0002;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(0.2, 48), new THREE.MeshStandardMaterial({ color: '#efe3dd', roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.00005;
ground.receiveShadow = true;
scene.add(ground);

const VIEWS = {
  ne: [1, 1], nw: [-1, 1], se: [1, -1], sw: [-1, -1]
};
function placeCamera(view) {
  if (view === 'wide') {
    // portrait screens: closer and aimed a little lower, so the tree isn't small at the bottom of a tall frame
    const portrait = camera.aspect < 1, k = portrait ? 0.72 : 1;
    controls.target.set(0, portrait ? 0.024 : 0.03, 0);
    camera.position.set(0.21 * k, controls.target.y + (0.13 - 0.03) * k, 0.25 * k);
    camera.lookAt(controls.target); controls.update();
    return;
  }
  const d = 0.135;
  if (view === 'top') { camera.position.set(0, d * 1.05, 0.00001); controls.target.set(0, 0, 0); }
  else {
    const [sx, sz] = VIEWS[view] || VIEWS.ne, e = 30 * Math.PI / 180;
    camera.position.set(sx * d * Math.cos(e) * Math.SQRT1_2, 0.014 + d * Math.sin(e), sz * d * Math.cos(e) * Math.SQRT1_2);
  }
  camera.lookAt(controls.target);
  controls.update();
}
placeCamera(qs.get('view') || 'wide');

let viewTouched = false;
controls.addEventListener('start', () => { viewTouched = true; });
function layout3d() {
  Object.assign(wrap.style, { width: innerWidth + 'px', height: innerHeight + 'px' });
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
layout3d();
addEventListener('resize', () => {
  if (mode !== '3d') { if (ar) ar.layout(); return; }
  const wasPortrait = camera.aspect < 1;
  Object.assign(wrap.style, { width: innerWidth + 'px', height: innerHeight + 'px' });
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  // turned the phone round before moving the view: frame it again for the new shape
  if (!viewTouched && wasPortrait !== camera.aspect < 1 && !qs.get('view') && (typeof director === 'undefined' || director.phase === 'idle')) placeCamera('wide');
});

const stage = new THREE.Group();
stage.name = 'stage';
scene.add(stage);

const gltf = await new GLTFLoader().loadAsync(qs.get('tree') || 'tree.glb');
const tree = gltf.scene.getObjectByName('SakuraQR') || gltf.scene;
tree.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
stage.add(tree);
const info = tree.userData.sakuraqr;

const SONG_LENGTH = 93.27;   // seconds; the show loops with the song
let anim = await setup({ THREE, stage, tree, info, mode: qs.get('mode') || '3d', showLength: SONG_LENGTH });

// ---- background music -------------------------------------------------------------------------------------------
// Loops audio/bgm.m4a (muque「いいんじゃない」, 93.3 s) and drives the show from its position. Browsers only allow sound after the viewer has
// interacted with the page, so if autoplay is refused the button waits in the paused state for a tap; until the song
// has started once, the show runs on scene.js's own clock. Paused, the story holds where the song is.
const music = { started: false, failed: false };
const bgm = qs.get('nomusic') || qs.get('test') ? null : new Audio('audio/bgm.m4a');
const btn = document.getElementById('music');
window.__bgm = bgm; window.__stage = stage;   // for test/shots.mjs
if (bgm) {
  bgm.loop = true;
  bgm.preload = 'auto';
  // 'playing' only once sound is actually coming out (not merely asked for, while the file is still loading)
  let sounding = false;
  const show = () => { const on = sounding && !bgm.paused; btn.classList.toggle('playing', on); btn.title = on ? '点击暂停' : '点击播放'; };
  // The button shows straight away, paused. (Don't wait for the audio to load first: iOS Safari loads nothing
  // until the viewer taps, so it would never appear.) If the file can't be played at all it stays, greyed out.
  show();
  btn.hidden = false;
  // the arrow pointing at the button, until it is first tapped (or the music starts by itself); never again after
  const hint = document.getElementById('hint');
  const dismissHint = () => { hint.hidden = true; };
  hint.hidden = false;
  btn.addEventListener('click', dismissHint, { once: true });
  bgm.addEventListener('playing', dismissHint, { once: true });
  bgm.addEventListener('playing', () => { sounding = true; music.started = true; show(); });
  bgm.addEventListener('pause', () => { sounding = false; show(); });
  bgm.addEventListener('error', () => {
    music.failed = true; sounding = false; show(); document.getElementById('hint').hidden = true;
    btn.disabled = true; btn.title = '音乐无法播放'; btn.setAttribute('aria-label', '背景音乐：muque - いいんじゃない（无法播放）');
  });
  btn.addEventListener('click', () => { if (recorder && recorder.recording) return; if (bgm.paused) bgm.play().catch(() => show()); else bgm.pause(); });
  bgm.play().catch(() => show());        // autoplay refused: wait for a tap
}
const showTime = () => (bgm && music.started && !music.failed ? bgm.currentTime : undefined);

// timing of update()
const times = [];
function timedUpdate(dt, elapsed, show) {
  const t0 = performance.now();
  anim.update(dt, elapsed, show);
  times.push(performance.now() - t0);
}

let elapsed = 0;
const ff = +(qs.get('t') || 0);
const report = { errors: [] };
if (qs.get('test')) Object.assign(report, await check());
else for (; elapsed < ff; elapsed += 1 / 30) timedUpdate(1 / 30, elapsed, elapsed);

// view = w0 | w1 | w2: close-up of one walker; group: all three. Seen from outside the tree, looking in.
const wv = /^w(\d)$|^group$/.exec(qs.get('view') || '');
if (wv) {
  const walkers = [];
  const whaleObj = stage.getObjectByName('whale');
  stage.traverse(o => { if (o.isSkinnedMesh && !(whaleObj && whaleObj.getObjectById(o.id))) walkers.push(o.parent); });
  stage.updateMatrixWorld(true);
  const list = wv[1] !== undefined ? [walkers[+wv[1]]] : walkers;
  const p = new THREE.Vector3();
  for (const w of list) p.add(w.getWorldPosition(new THREE.Vector3()));
  p.divideScalar(list.length);
  const out = new THREE.Vector3(p.x, 0, p.z).normalize();
  const side = new THREE.Vector3(-out.z, 0, out.x);
  const d = list.length > 1 ? 0.034 : 0.022;
  controls.target.copy(p).add(new THREE.Vector3(0, 0.0035, 0));
  camera.position.copy(p).addScaledVector(out, d).addScaledVector(side, d * 0.35).add(new THREE.Vector3(0, d * 0.28, 0));
  camera.lookAt(controls.target); controls.update();
}
// ---- camera director ----------------------------------------------------------------------------------------------
// When the three stop to watch the whale, the camera glides (2.5 s) round to the side 45 degrees counter-clockwise
// of them about the trunk (seen from above), looking down, far enough back to frame them and the whale together, and
// follows the whale gently while they watch (it arrives 25 degrees clockwise of them, so they see it across open
// sky). When they run off it glides back. If the canopy would hide any of them, the camera rises until it doesn't. Dragging the view cancels the shot
// until the next one. Off with ?view= or ?test=.
const director = { on: !qs.get('view') && !qs.get('test'), phase: 'idle', t: 0, cancelled: false, first: true };
const animRoot = () => stage.getObjectByName('SakuraQR-animation');
const runnerObjs = () => {
  const whaleObj = stage.getObjectByName('whale'), list = [];
  stage.traverse(o => { if (o.isSkinnedMesh && !(whaleObj && whaleObj.getObjectById(o.id))) list.push(o.parent); });
  return list;
};
const SHOT = { around: -Math.PI / 4, elevation: 0.45, drift: -0.1, glide: 2.5, follow: 1.5 };
const trunkAt = new THREE.Vector3(info.trunk.centre[0], 0, info.trunk.centre[1]);   // the tree sits at the stage origin
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
controls.addEventListener('start', () => { if (director.phase !== 'idle') { director.phase = 'idle'; director.cancelled = true; } });
const treeSolids = [];
tree.traverse(o => { if (o.isMesh) treeSolids.push(o); });
const sightRay = new THREE.Raycaster();
function clearSight(from, to) {
  const d = to.clone().sub(from), len = d.length();
  sightRay.set(from, d.normalize()); sightRay.far = len;
  return !sightRay.intersectObjects(treeSolids, false).length;
}
function runnersCentre(objs) {
  const c = new THREE.Vector3();
  for (const o of objs) c.add(o.getWorldPosition(new THREE.Vector3()));
  return c.divideScalar(objs.length || 1);
}
// camera for the shot: on the side `around` round the trunk from the runners, looking down at `elevation`, and far
// enough back that the runners and the whale (when it is up) are both in frame
function shotPose(around, elevation) {
  const objs = runnerObjs(), c = runnersCentre(objs);
  const a = Math.atan2(c.z - trunkAt.z, c.x - trunkAt.x) + around;
  const dir = new THREE.Vector3(Math.cos(a) * Math.cos(elevation), Math.sin(elevation), Math.sin(a) * Math.cos(elevation));
  const whaleObj = stage.getObjectByName('whale');
  let target = c.clone().add(new THREE.Vector3(0, 0.003, 0)), radius = 0.012;
  if (whaleObj && whaleObj.visible) {
    const w = whaleObj.getWorldPosition(new THREE.Vector3());
    target = c.clone().lerp(w, 0.5);
    radius = c.distanceTo(w) / 2 + 13 * info.cell;            // plus half the whale's length
  }
  const half = Math.min(camera.fov / 2, THREE.MathUtils.radToDeg(Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect))) * Math.PI / 180;
  const dist = radius / Math.sin(half) * 0.88;     // the framing sphere is generous: a little tighter
  return { target, pos: target.clone().addScaledVector(dir, dist) };
}
function direct(dt) {
  if (!director.on) return;
  const runners = (animRoot() && animRoot().userData.runners) || [];
  const watching = runners.some(r => r.mode === 'watch');
  if (!watching) director.cancelled = false;
  const d = director;
  if (d.phase === 'idle' && watching && !d.cancelled) {
    d.saved = { pos: camera.position.clone(), target: controls.target.clone() };
    // 45 degrees up; higher if the canopy is in the way of any of them (checked over the drift too)
    const objs = runnerObjs();
    d.elevation = SHOT.elevation;
    for (; d.elevation < 1.4; d.elevation += 0.08) {
      const ok = [0, SHOT.drift].every(dr => { const p = shotPose(SHOT.around + dr, d.elevation);
        return objs.every(o => clearSight(o.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.003, 0)), p.pos)); });
      if (ok) break;
    }
    d.phase = d.first ? 'hold' : 'in'; d.first0 = d.first; d.t = 0;   // already mid-shot when the page opens: cut straight to it
  }
  d.first = false;
  if (d.phase === 'idle') return;
  d.t += dt;
  const shot = shotPose(SHOT.around + SHOT.drift * Math.min(1, d.t / 9), d.elevation);
  if (d.phase === 'in') {
    const k = easeInOut(Math.min(1, d.t / SHOT.glide));
    camera.position.lerpVectors(d.saved.pos, shot.pos, k); controls.target.lerpVectors(d.saved.target, shot.target, k);
    if (k >= 1) d.phase = 'hold';
  } else if (d.phase === 'hold') {
    const k = Math.min(1, dt * SHOT.follow);        // follow the circling whale gently
    camera.position.lerp(shot.pos, k); controls.target.lerp(shot.target, k);
    if (d.t < 0.05 && d.first0) { camera.position.copy(shot.pos); controls.target.copy(shot.target); }
    if (!watching) { d.phase = 'out'; d.t = 0; d.from = { pos: camera.position.clone(), target: controls.target.clone() }; }
  } else if (d.phase === 'out') {
    const k = easeInOut(Math.min(1, d.t / SHOT.glide));
    camera.position.lerpVectors(d.from.pos, d.saved.pos, k); controls.target.lerpVectors(d.from.target, d.saved.target, k);
    if (k >= 1) d.phase = 'idle';
  }
  camera.lookAt(controls.target);
  window.__director = d.phase;
}

// ---- 3D <-> AR (the button at the top left) -------------------------------------------------------------------------
// AR loads on first use: ar/mode.js with a second copy of the tree and its own scene.js, the WebAR.rocks runtime and
// the network (~5 MB). Both run on this page's renderer and music, so the show carries on where it was. Leaving AR
// turns the camera off. If the camera or the network can't be had, the page goes back to 3D and says why.
const modeBtn = $('mode'), video = $('video'), qualityBtn = $('quality');
// the camera's resolution in AR, by its short side: ?cam=720|1080|2160, else what this viewer picked last, else 1080
const QUALITIES = [720, 1080, 2160];
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let camQuality = [+qs.get('cam'), +store.get('sakura-cam'), 1080].find(q => QUALITIES.includes(q));
function showQuality() {   // what the camera actually gives (it may not have what was asked for)
  const short = Math.min(video.videoWidth, video.videoHeight);
  qualityBtn.textContent = '画质 ' + (short ? (short >= 2000 ? '4K' : short + 'p') : (camQuality >= 2000 ? '4K' : camQuality + 'p'));
}
qualityBtn.addEventListener('click', async () => {
  if (!ar || mode !== 'ar') return;
  camQuality = QUALITIES[(QUALITIES.indexOf(camQuality) + 1) % QUALITIES.length];
  store.set('sakura-cam', camQuality);
  qualityBtn.disabled = true; qualityBtn.textContent = '画质 …';
  try { await ar.setQuality(camQuality); } catch (e) { console.warn('camera:', e); tip('切换画质失败：' + (e && e.message || e), 5000); }
  qualityBtn.disabled = false; showQuality();
  const asked = camQuality, got = Math.min(video.videoWidth, video.videoHeight);
  if (got && got < asked) tip(`这个相机最高只给 ${got}p`, 3000);
});
let tipTimer = 0;
function tip(text, ms) {
  clearTimeout(tipTimer);
  $('tip').textContent = text || ''; $('tip').classList.toggle('off', !text);
  if (text && ms) tipTimer = setTimeout(() => tip(''), ms);
}
function showMode() {
  const toAR = mode === '3d';
  modeBtn.querySelector('.label').textContent = toAR ? 'AR' : '3D';
  modeBtn.setAttribute('aria-label', toAR ? '切换到 AR：用相机看打印出来的树' : '切换回 3D 动画');
  modeBtn.title = toAR ? '用相机看打印出来的树' : '回到 3D 动画';
  window.__mode = mode;
}
async function enterAR() {
  if (mode !== '3d') return;
  modeBtn.disabled = true;
  mode = 'ar'; controls.enabled = false; document.body.classList.add('ar'); showMode();
  if (bgm && bgm.paused && !music.failed && !(recorder && recorder.recording)) bgm.play().catch(() => {});   // a tap: sound may start
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('这个浏览器不能使用相机（需要 HTTPS）');
    if (!ar) {
      tip('正在准备 AR…');
      const { createAR } = await import('./ar/mode.js');
      ar = await createAR({ renderer, tree: tree.clone(), info, setup, showLength: SONG_LENGTH, video, nnCanvas: $('nn'), wrap,
        debug: !!qs.get('debug'), fov: +(qs.get('fov') || 63), refine: qs.get('refine') !== '0', tip });
      window.__ar = ar;
    }
    await ar.start(camQuality);
    showQuality();
  } catch (e) {
    console.warn('AR:', e);
    leaveAR();
    tip(e && e.name === 'NotAllowedError' ? '需要允许使用相机才能进入 AR' : '打不开 AR：' + (e && e.message || e), 6000);
  }
  modeBtn.disabled = false;
}
function leaveAR() {
  if (mode !== 'ar') return;
  if (ar) ar.stop();
  mode = '3d'; controls.enabled = true; document.body.classList.remove('ar'); showMode();
  tip('');
  hud.textContent = hud3d;
  layout3d();
}
modeBtn.addEventListener('click', () => { if (mode === '3d') enterAR(); else leaveAR(); });
showMode();
if (qs.get('ar')) enterAR();

// ---- recording (?rec=1) ---------------------------------------------------------------------------------------------
// The red button at the bottom: from the start of the song to its end, what is on screen (without the buttons) and the
// song. Then the clip, to save or share. Tap again to stop early.
const recBtn = $('rec');
let clipURL = '';
function drawView(g, W, H) {   // the page as seen: the 3D layer (and in AR the camera image under it), cropped like the screen
  g.fillStyle = mode === 'ar' ? '#111' : '#f4ede9'; g.fillRect(0, 0, W, H);
  const r = wrap.getBoundingClientRect(), sx = W / innerWidth, sy = H / innerHeight;
  const box = [r.left * sx, r.top * sy, r.width * sx, r.height * sy];
  if (mode === 'ar' && video.videoWidth) g.drawImage(video, ...box);
  g.drawImage(renderer.domElement, ...box);
}
if (qs.get('rec')) {
  const { createRecorder } = await import('./rec.js');
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  recorder = createRecorder({ audio: bgm, length: SONG_LENGTH, onState: s => {
    recBtn.classList.toggle('on', s.recording);
    recBtn.style.setProperty('--p', s.recording ? (1 - s.remaining / SONG_LENGTH).toFixed(4) : 0);
    recBtn.querySelector('.time').textContent = s.recording ? '● ' + fmt(s.remaining) : '';
    btn.disabled = s.recording || music.failed;
    if (s.file) showClip(s.file);
  } });
  window.__recorder = recorder;
  document.body.classList.add('rec');
  recBtn.hidden = false;
  if (!recorder.supported) { recBtn.disabled = true; recBtn.title = '这个浏览器不支持录像'; }
  else recBtn.title = '录像：从头录完一首歌（' + fmt(SONG_LENGTH) + '）';
  recBtn.addEventListener('click', () => {
    if (recorder.recording) recorder.stop();
    else { $('hint').hidden = true; recorder.start().catch(e => { console.warn('rec:', e); tip('录像失败：' + (e && e.message || e), 6000); }); }
  });
}
function showClip(file) {
  if (clipURL) URL.revokeObjectURL(clipURL);
  clipURL = URL.createObjectURL(file);
  window.__clip = file;
  $('clip').src = clipURL + '#t=0.1';   // (shows a first frame rather than black)
  Object.assign($('save'), { href: clipURL, download: file.name });
  $('clipinfo').textContent = `${file.name} · ${(file.size / 1048576).toFixed(1)} MB`;
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  $('share').hidden = !canShare;
  $('share').onclick = () => navigator.share({ files: [file], title: 'Sakura QR' }).catch(() => {});
  $('saved').hidden = false;
}
$('close').addEventListener('click', () => { $('saved').hidden = true; $('clip').pause(); });

const paused = !!qs.get('pause');
let last = performance.now(), frames = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (mode === 'ar') {
    elapsed += dt;
    if (ar) { ar.frame(now, dt, elapsed, showTime()); if (DEBUG) hud.textContent = ar.hud; }
    else renderer.clear();
    if (recorder) recorder.frame(drawView);
    return;
  }
  if (!paused) { elapsed += dt; timedUpdate(dt, elapsed, showTime()); }
  direct(dt);
  controls.update();
  renderer.render(scene, camera);
  if (recorder) recorder.frame(drawView);
  if (++frames === 3) {
    const r = renderer.info.render;
    report.drawCalls = r.calls; report.triangles = r.triangles;
    const sorted = times.slice().sort((a, b) => a - b);
    report.slowest = times.map((t, i) => [t, i]).sort((a, b) => b[0] - a[0]).slice(0, 5);
    report.updateMs = { calls: times.length, median: sorted[sorted.length >> 1], p95: sorted[Math.floor(sorted.length * 0.95)], max: sorted[sorted.length - 1] };
    window.__report = report;
    window.__ready = true;
    hud.textContent = hud3d = `draw calls ${r.calls} · triangles ${r.triangles} · update ${report.updateMs.median.toFixed(3)} ms (p95 ${report.updateMs.p95.toFixed(3)})`;
  }
});

// ---- self-check ---------------------------------------------------------------------------------------------------
// Runs the animation for 90 s with 1/30 s steps and every 3 s tests, independently of scene.js's own collision grid:
//  * every walker vertex (after skinning) and every corner of every visible petal: is it inside the tree?
//    (a ray straight up from the point, counted against the tree's triangles from both sides: odd = inside)
//  * is everything within the plate plus 3 cubes and above y = 0, do the walkers stay on the plate?
//  * do two walkers ever come closer than their radii allow?
async function check() {
  stage.getObjectByName('SakuraQR-animation').userData.stats.where = [];
  const out = { samples: 0, points: 0, insideTree: [], outOfBounds: [], offPlate: [], walkerOverlap: 0, showErrors: [], timeline: [], whaleLowest: Infinity, whaleReach: 0, whaleVsRunners: [], petalsAboveCanopy: 0, aboveCanopy: [], petalsFloating: 0, floating: [], petalsLanded: { plate: 0, canopy: 0 } };
  const solid = [];
  tree.updateMatrixWorld(true);
  tree.traverse(o => {
    if (!o.isMesh) return;
    const m = new THREE.Mesh(o.geometry, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
    m.matrixAutoUpdate = false; m.matrix.copy(o.matrixWorld); m.matrixWorld.copy(o.matrixWorld);
    solid.push(m);
  });
  const ray = new THREE.Raycaster();
  const dir = new THREE.Vector3(0.0013, 1, 0.0021).normalize();
  const inside = p => { ray.set(p, dir); return ray.intersectObjects(solid, false).length % 2 === 1; };
  const cell = info.cell, half = info.plate.size / 2, lim = half + 3 * cell;
  const root = stage.getObjectByName('SakuraQR-animation');
  const petals = root.getObjectByName('petals');
  const corners = [];
  for (const x of [-0.25, 0.25]) for (const y of [-0.03, 0.03]) for (const z of [-0.25, 0.25]) corners.push(new THREE.Vector3(x, y, z));
  const m4 = new THREE.Matrix4(), v = new THREE.Vector3(), seen = new Set();
  const prevPos = [];
  const note = (list, what) => { if (list.length < 20) list.push(what); };
  const walkers = [];
  let whaleMesh = null;
  root.getObjectByName('whale').traverse(o => { if (o.isMesh) whaleMesh = o; });
  root.traverse(o => { if (o.isSkinnedMesh && o !== whaleMesh) walkers.push(o); });
  out.walkersShown = walkers.length === 3 && walkers.every(w => w.parent.visible);

  for (let step = 0; step <= 90 * 30; step++) {
    if (step) { elapsed += 1 / 30; timedUpdate(1 / 30, elapsed, elapsed); }   // song time = elapsed
    if (step % 90 === 89) {                   // remember where every petal is, one frame before each sample
      for (let i = 0; i < petals.count; i++) { petals.getMatrixAt(i, m4); m4.premultiply(petals.matrixWorld); prevPos[i] = [m4.elements[12], m4.elements[13], m4.elements[14]]; }
    }
    if (step % 90) continue;
    out.samples++;
    stage.updateMatrixWorld(true);
    for (const w of walkers) {
      w.skeleton.update();
      seen.clear();
      const pos = w.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        w.getVertexPosition(i, v); w.localToWorld(v);
        const k = v.x.toFixed(6) + v.y.toFixed(6) + v.z.toFixed(6);
        if (seen.has(k)) continue; seen.add(k);
        out.points++;
        if (Math.abs(v.x) > lim || Math.abs(v.z) > lim || v.y < 0) note(out.outOfBounds, [w.name, step / 30, v.toArray()]);
        if (v.y < info.plate.top + 0.02 * cell && (Math.abs(v.x) > half || Math.abs(v.z) > half)) note(out.offPlate, [w.name, step / 30, v.toArray()]);
        if (inside(v)) note(out.insideTree, [w.name, step / 30, v.toArray().map(n => +(n / cell).toFixed(2))]);
      }
    }
    // the show: the whale is up from 17 s to 63 s; the runners look at it from ~21 to ~28.5 s, run before and after,
    // and hop from ~64 s
    const t = elapsed, whale = root.getObjectByName('whale');
    const whaleUp = whale.visible;
    if (whaleUp !== (t >= 17 && t < 62.9)) note(out.showErrors, ['whale visible ' + whaleUp, +t.toFixed(2)]);
    const expect = t >= 21.5 && t <= 28.5 ? 'look' : t >= 64 ? 'hop' : (t < 19.4 || (t >= 30 && t < 63)) ? 'run' : null;
    const runners = root.userData.runners || [];
    runners.forEach((r, i) => {
      if (expect && r.act !== expect) note(out.showErrors, ['runner ' + i + ' ' + r.act + ' (expected ' + expect + ')', +t.toFixed(2)]);
      if (expect === 'look' && r.v > 0.01) note(out.showErrors, ['runner ' + i + ' moving while watching', +t.toFixed(2)]);
    });
    out.timeline.push([+t.toFixed(1), whaleUp ? 'whale' : '-', runners.map(r => r.act).join(',')]);
    if (expect === 'look' && whaleUp) {            // while watching, each of them must be able to see the whale
      const wp = whale.getWorldPosition(new THREE.Vector3()), plan = root.userData.whalePlan;
      for (const w of walkers) {
        const eye = w.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 3.5 * cell, 0));
        const d = wp.clone().sub(eye), len = d.length();
        ray.set(eye, d.normalize()); ray.far = len;
        if (ray.intersectObjects(solid, false).length) note(out.showErrors, [w.name + ' cannot see the whale', +t.toFixed(2)]);
        ray.far = Infinity;
      }
      out.whaleVsRunners.push([+t.toFixed(1), +(((plan.whale - plan.runners) * 180 / Math.PI + 540) % 360 - 180).toFixed(1)]);
    }
    if (whaleUp && whaleMesh) {                     // the whale: never in the tree, never past plate + 3 cubes
      whaleMesh.skeleton && whaleMesh.skeleton.update();
      seen.clear();
      const pos = whaleMesh.geometry.attributes.position;
      let low = Infinity;
      for (let i = 0; i < pos.count; i++) {
        whaleMesh.getVertexPosition(i, v); whaleMesh.localToWorld(v);
        const k = v.x.toFixed(6) + v.y.toFixed(6) + v.z.toFixed(6);
        if (seen.has(k)) continue; seen.add(k);
        out.points++;
        low = Math.min(low, v.y);
        // the whale may go beyond plate + 3 cubes, but only as far as its own circle (plus fins) takes it
        const orbit = root.userData.whaleOrbit, dx = v.x / cell - orbit.centre[0], dz = v.z / cell - orbit.centre[1];
        if (Math.hypot(dx, dz) > orbit.reach + 1.5 || v.y < 0) note(out.outOfBounds, ['whale', +t.toFixed(2), v.toArray().map(n => +(n / cell).toFixed(2))]);
        out.whaleReach = Math.max(out.whaleReach, Math.hypot(dx, dz));
        if (inside(v)) note(out.insideTree, ['whale', +t.toFixed(2), v.toArray().map(n => +(n / cell).toFixed(2))]);
      }
      out.whaleLowest = Math.min(out.whaleLowest, low / cell);
    }
    for (let a = 0; a < walkers.length; a++) for (let b = a + 1; b < walkers.length; b++) {
      const pa = new THREE.Vector3(), pb = new THREE.Vector3();
      walkers[a].getWorldPosition(pa); walkers[b].getWorldPosition(pb);
      if (pa.distanceTo(pb) < 2.2 * cell) out.walkerOverlap++;
    }
    for (let i = 0; i < petals.count; i++) {
      petals.getMatrixAt(i, m4);
      if (m4.elements[0] === 0 && m4.elements[1] === 0 && m4.elements[2] === 0) continue;   // hidden (scale 0)
      m4.premultiply(petals.matrixWorld);
      for (const c of corners) {
        v.copy(c).applyMatrix4(m4);
        out.points++;
        if (Math.abs(v.x) > lim || Math.abs(v.z) > lim || v.y < 0) note(out.outOfBounds, ['petal ' + i, step / 30, v.toArray()]);
        if (inside(v)) note(out.insideTree, ['petal ' + i, step / 30, v.toArray().map(n => +(n / cell).toFixed(2))]);
      }
      const e = m4.elements;
      const pp = prevPos[i], still = pp && pp[0] === e[12] && pp[1] === e[13] && pp[2] === e[14];
      if (!still) {                                                        // moving → in the air: not above the canopy top near it
        const g = info.grid, col = Math.floor((e[12] - g.origin[0]) / cell), row = Math.floor((e[14] - g.origin[1]) / cell);
        let top = 0;
        for (let r = row - 2; r <= row + 2; r++) for (let c = col - 2; c <= col + 2; c++) if (g.surface[r] && g.surface[r][c] > top) top = g.surface[r][c];
        if (top > 1 && e[13] / cell > top) { out.petalsAboveCanopy++; note(out.aboveCanopy, ['petal ' + i, step / 30, [e[12] / cell, e[13] / cell, e[14] / cell].map(n => +n.toFixed(2)), top]); }
      }
      if (still && Math.abs(e[5]) > 0.99 * Math.hypot(e[4], e[5], e[6])) {        // lying flat and not moving → resting
        const y = e[13] / cell;
        if (y < info.plate.top / cell + 0.1) out.petalsLanded.plate++; else out.petalsLanded.canopy++;
        // something must be right under its middle: a ray straight down from the centre hits the tree within reach
        ray.set(new THREE.Vector3(e[12], e[13], e[14]), new THREE.Vector3(0.0011, -1, 0.0017).normalize());
        ray.far = 0.1 * cell;
        if (!ray.intersectObjects(solid, false).length) { out.petalsFloating++; note(out.floating, ['petal ' + i, step / 30, [e[12] / cell, e[13] / cell, e[14] / cell].map(n => +n.toFixed(2))]); }
        ray.far = Infinity;
      }
    }
    await new Promise(r => setTimeout(r));
  }
  out.petalStats = Object.assign({}, root.userData.stats);
  // dispose() must leave the stage as it found it; then set up again (same seed, same start)
  anim.dispose();
  out.stageAfterDispose = stage.children.map(o => o.name);
  anim = await setup({ THREE, stage, tree, info, mode: qs.get('mode') || '3d' });
  return out;
}

addEventListener('error', e => report.errors.push(String(e.message)));
</script>
</body>
</html>
